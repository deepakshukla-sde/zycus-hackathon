spring.application.name=zycus-hackathon

# Database
spring.datasource.url=jdbc:postgresql://localhost:5432/zycus-hackathon
spring.datasource.username=admin
spring.datasource.password=admin
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT
app.jwt.secret=zycus-hackathon-secret-key-2024-must-be-at-least-256-bits-long-for-hs256
app.jwt.expiration=86400000

# LLM
llm.provider=${LLM_PROVIDER:gpt}
llm.api-key=${LLM_API_KEY:}
llm.model=${LLM_MODEL:gpt-4o-mini}
llm.base-url=${LLM_BASE_URL:https://api.openai.com/v1/chat/completions}

# Actuator
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Polling
app.polling.interval=${POLLING_INTERVAL:3000}

# Logging
logging.level.com.zycus=INFO
